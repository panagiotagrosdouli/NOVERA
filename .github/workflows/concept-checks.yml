name: NOVERA ONE concept checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/one-interaction.mjs

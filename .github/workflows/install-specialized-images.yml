name: Install NOVERA specialized concept images
on:
  push:
    branches: [main]
    paths:
      - NOVERA-SPECIALIZED-15-UNIQUE-IMAGES.zip
      - .github/workflows/install-specialized-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and validate 15 original concept WebP images
        run: python scripts/install-specialized-images.py
      - name: Commit image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/specialized/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add 15 unique NOVERA specialized concept images"
            git push
          fi
